app = 'backend-restless-lake-87'
primary_region = 'nrt'

[build]

  [http_service]
    internal_port = 8080
    force_https = true
    auto_stop_machines = 'stop'
    auto_start_machines = true
    min_machines_running = 0
    processes = ['app']
    
  [build.builder_vm]
    memory = "4gb"
    cpus = 2

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
